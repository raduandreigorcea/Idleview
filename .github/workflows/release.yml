name: Release

# Every push to main cuts a new release: the version is auto-bumped (patch) from the
# latest v* tag, the Tauri app is built for Windows and Linux, and the installers are
# published to a fresh GitHub Release. You can also run it by hand from the Actions tab.
#
# To push without cutting a release, put [skip release] anywhere in the commit message.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# tauri-action creates the tag + release and uploads assets to it.
permissions:
  contents: write

jobs:
  # Work out the next version from the highest existing v* tag, so releases march forward
  # on their own (v0.1.0 -> v0.1.1 -> ...). Nothing is committed back to the repo - the
  # tags are the source of truth, which keeps your local main in sync without a pull.
  version:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: compute
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          base=${latest#v}
          IFS='.' read -r major minor patch <<< "$base"
          next="${major}.${minor}.$((patch + 1))"
          echo "Latest tag: ${latest} -> next: v${next}"
          echo "version=${next}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows -> .exe (NSIS) and .msi, per bundle.targets in tauri.conf.json.
          - platform: windows-latest
          # Linux -> .deb and .rpm. 22.04 keeps the glibc requirement low so the
          # binaries run on a wide range of distros.
          - platform: ubuntu-22.04

    runs-on: ${{ matrix.platform }}

    steps:
      # The control panel is a git submodule that gets built into the app, so it must be
      # checked out too.
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Stamp the computed version into tauri.conf.json so the installers carry it. This
      # edit lives only on the runner; it is never committed.
      - name: Set release version
        shell: bash
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f));j.version=process.env.V;fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')"

      # Tauri v2's Linux toolchain. `rpm` is needed for the .rpm bundle target.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            libxdo-dev \
            build-essential \
            file

      # Node is needed for beforeBuildCommand, which installs and builds the control panel.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Caches the Rust build so reruns don't recompile every crate from scratch.
      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-action drives the build through this repo's `npm run tauri build`, which
      # needs @tauri-apps/cli from the root package.json. beforeBuildCommand only installs
      # the control panel's deps, so the root deps have to be installed here.
      - name: Install root dependencies
        run: npm install

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseName: 'Idleview v${{ needs.version.outputs.version }}'
          releaseBody: 'Automated build. Installers are attached below.'
          releaseDraft: false
          prerelease: false
