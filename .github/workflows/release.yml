name: Release

# Releases are cut by pushing a version tag:
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# The tag is the version. Pushing to main no longer ships anything, so a typo fix does
# not publish installers. You can also run this by hand from the Actions tab on a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Everything that runs without a GUI toolchain. A release never ships red.
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Core logic (Rust)
        run: cargo test --manifest-path core/Cargo.toml
      - name: Dashboard, photo proxy and control panel (JS)
        run: |
          npm ci
          npm --prefix proxy ci
          npm --prefix idleview-control ci
          npm test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows -> .exe (NSIS) and .msi.
          - platform: windows-latest
            args: ''
          # Linux x64 -> .deb and .rpm. 22.04 keeps the glibc requirement low so the
          # packages install on a wide range of distros.
          - platform: ubuntu-22.04
            args: ''
          # Raspberry Pi and other ARM64 Linux (Pi OS 64-bit) -> .deb and .rpm, built
          # natively on GitHub's ARM runners.
          - platform: ubuntu-22.04-arm
            args: ''
          # macOS -> one .dmg for both Apple Silicon and Intel. Unsigned: first launch
          # needs right-click > Open until an Apple Developer ID is set up.
          - platform: macos-latest
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      # The control panel is a submodule that gets built into the app.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # v1.2.3 -> 1.2.3, stamped into tauri.conf.json on the runner only (never committed).
      - name: Set release version
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const f='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(f));j.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(j,null,2)+'\n')" "$V"

      # Tauri v2's Linux toolchain. `rpm` is needed for the .rpm bundle target.
      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            libxdo-dev \
            build-essential \
            file

      # Node is needed for beforeBuildCommand, which builds the control panel.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal macOS build compiles for both architectures.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-action runs this repo's `npm run tauri build`, which needs the root deps.
      - name: Install root dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Idleview ${{ github.ref_name }}'
          releaseBody: 'Installers for Windows, macOS, Linux (x64) and Raspberry Pi (ARM64) are attached below.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
